<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Uses Bingo</title>

  <style>
    /* 
      WATER USES BINGO
      Beginner note:
      You can edit colors, font sizes, and phrases easily.
      The phrase list is in the JavaScript section near the bottom.
    */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #064b75;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.95) 0 4%, transparent 5%),
        radial-gradient(circle at 82% 15%, rgba(255,255,255,0.7) 0 3%, transparent 4%),
        radial-gradient(circle at 75% 78%, rgba(255,255,255,0.65) 0 5%, transparent 6%),
        linear-gradient(135deg, #e9fbff 0%, #c9f1ff 45%, #a9ddff 100%);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.7);
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }

    .bubble.one {
      width: 90px;
      height: 90px;
      left: 8%;
      top: 18%;
    }

    .bubble.two {
      width: 55px;
      height: 55px;
      right: 10%;
      top: 24%;
      animation-delay: 1.2s;
    }

    .bubble.three {
      width: 120px;
      height: 120px;
      right: 14%;
      bottom: 12%;
      animation-delay: 2s;
    }

    .bubble.four {
      width: 45px;
      height: 45px;
      left: 16%;
      bottom: 18%;
      animation-delay: 0.7s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-16px) scale(1.04);
      }
    }

    .game-card {
      width: min(100%, 980px);
      background: rgba(255, 255, 255, 0.88);
      border: 4px solid rgba(255, 255, 255, 0.95);
      border-radius: 36px;
      padding: 34px;
      box-shadow: 0 18px 45px rgba(21, 122, 176, 0.22);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(42px, 7vw, 82px);
      color: #087fc0;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 0 22px;
      font-size: clamp(18px, 2.5vw, 26px);
      color: #257aa6;
    }

    .phrase-box {
      min-height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 22px auto 28px;
      padding: 28px;
      border-radius: 32px;
      background: linear-gradient(180deg, #ffffff 0%, #e9faff 100%);
      border: 5px solid #8edcff;
      box-shadow: inset 0 0 18px rgba(85, 191, 242, 0.18);
    }

    #currentPhrase {
      margin: 0;
      font-size: clamp(48px, 8vw, 98px);
      line-height: 1.05;
      color: #045d95;
      font-weight: 900;
      text-transform: lowercase;
      word-break: break-word;
    }

    .phrase-animate {
      animation: popFade 0.45s ease both;
    }

    @keyframes popFade {
      0% {
        opacity: 0;
        transform: scale(0.86) translateY(14px);
      }
      70% {
        opacity: 1;
        transform: scale(1.05) translateY(0);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
      margin-bottom: 28px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 20px 34px;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 900;
      color: #ffffff;
      box-shadow: 0 9px 0 rgba(3, 92, 143, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-3px);
      filter: brightness(1.04);
      box-shadow: 0 12px 0 rgba(3, 92, 143, 0.22);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 5px 0 rgba(3, 92, 143, 0.22);
    }

    .next-button {
      background: linear-gradient(180deg, #28b8ff, #0786d8);
    }

    .bingo-button {
      background: linear-gradient(180deg, #55d6c6, #0a9fa7);
    }
.wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 90px;
      background:
        radial-gradient(60px 45px at 40px 10px, rgba(255,255,255,0.78) 0 60%, transparent 62%) repeat-x,
        linear-gradient(180deg, rgba(66, 190, 242, 0.2), rgba(41, 156, 220, 0.28));
      background-size: 120px 90px, 100% 100%;
      opacity: 0.9;
      pointer-events: none;
    }

    @media (max-width: 620px) {
      .game-card {
        padding: 22px;
        border-radius: 28px;
      }

      .phrase-box {
        min-height: 170px;
        padding: 18px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="bubble one"></div>
    <div class="bubble two"></div>
    <div class="bubble three"></div>
    <div class="bubble four"></div>

    <section class="game-card" aria-label="Water Uses Bingo game">
      <h1>Water Uses Bingo</h1>
      <p class="subtitle">Click “Next Phrase” and read the phrase aloud.</p>

      <div class="phrase-box">
        <p id="currentPhrase">Ready?</p>
      </div>

      <div class="buttons">
        <button class="next-button" id="nextButton" type="button">Next Phrase</button>
        <button class="bingo-button" id="bingoButton" type="button">Bingo!</button>
      </div>
</section>

    <div class="wave"></div>
  </main>

  <script>
    /*
      EDIT PHRASES HERE
      Add, remove, or change phrases in this list.
      Keep each phrase inside quotation marks.
    */
    const allPhrases = [
      "go to bathroom",
      "clean my room",
      "wash clothes",
      "cook soup",
      "drink tea",
      "water flowers",
      "swim",
      "play with water",
      "brush my teeth",
      "take shower",
      "clean car",
      "wash face"
    ];

    // These arrays keep track of the current round.
    let availablePhrases = [...allPhrases];
    let usedPhrases = [];

    // Find page elements.
    const currentPhrase = document.getElementById("currentPhrase");
    const nextButton = document.getElementById("nextButton");
    const bingoButton = document.getElementById("bingoButton");

    function showAnimatedPhrase(text) {
      currentPhrase.textContent = text;

      // Restart the animation every time the phrase changes.
      currentPhrase.classList.remove("phrase-animate");
      void currentPhrase.offsetWidth;
      currentPhrase.classList.add("phrase-animate");
    }
    function nextPhrase() {
      if (availablePhrases.length === 0) {
        showAnimatedPhrase("All phrases used! Click Bingo to restart.");
        return;
      }

      // Pick a random phrase from the available phrases.
      const randomIndex = Math.floor(Math.random() * availablePhrases.length);
      const phrase = availablePhrases[randomIndex];

      // Remove the phrase so it cannot appear again in this round.
      availablePhrases.splice(randomIndex, 1);

      // Save the phrase in the used list.
      usedPhrases.push(phrase);

      showAnimatedPhrase(phrase);
    }

    function resetGame() {
      availablePhrases = [...allPhrases];
      usedPhrases = [];
      showAnimatedPhrase("Ready?");
    }

    nextButton.addEventListener("click", nextPhrase);
    bingoButton.addEventListener("click", resetGame);
  </script>
</body>
</html>
